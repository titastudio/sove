/* main.css */
/* SOVÉ — design system */
:root{
  --ink:#0b0a0a; --ink2:#121010; --ink3:#1a1716; --line:#2c2725; --line2:#4a423e;
  --ox:#8e1b1f; --ox2:#a9242a; --oxt:#e0565c; --oxd:#5e1114; --ivory:#f2ede6; --ivory2:#ddd5ca; --mute:#a59b95; --mute2:#8f857f;
  --gold:#c8a97e; --ok:#6fae86; --warn:#d7a14a; --bad:#d0565b;
  --sans:'Jost',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif; --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --w:1240px; --r:2px; --pill:999px;
  --fs:15px;
}
*{box-sizing:border-box}
html{background:var(--ink);color:var(--ivory);font-family:var(--sans);font-size:var(--fs);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--ink);overflow-x:hidden}
body.hc{--mute:#cfc6bf;--line:#4a4340}
body.lg{--fs:16px}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ox);color:var(--ivory)}
.ic{width:18px;height:18px;flex:none;vertical-align:middle}
.vmark{width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-left:4px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 32px}
.narrow{max-width:820px;margin:0 auto;padding:0 32px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mute{color:var(--mute)} .mute2{color:var(--mute2)} .ox{color:var(--oxt)} .gold{color:var(--gold)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:.86rem} .tiny{font-size:.74rem;letter-spacing:.04em} .lead{font-size:1.08rem;line-height:1.75;color:var(--ivory2)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
.script{font-family:var(--script)}
.up{text-transform:uppercase;letter-spacing:.18em}
.kick{font-size:.72rem;text-transform:uppercase;letter-spacing:.28em;color:var(--mute)}
.acc{color:var(--oxt)}
.right{text-align:right} .center{text-align:center}
.row{display:flex;gap:12px;align-items:center} .row.wrapf{flex-wrap:wrap} .row.sb{justify-content:space-between} .row.top{align-items:flex-start} .row.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap8{gap:8px}.gap16{gap:16px}.gap24{gap:24px}.gap32{gap:32px}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}.mt64{margin-top:64px}.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
h1,h2,h3,h4{font-weight:400;margin:0 0 .5em;letter-spacing:.06em;line-height:1.15}
.d1{font-size:clamp(2.6rem,5.6vw,5rem);text-transform:uppercase;letter-spacing:.08em;font-weight:300;line-height:1.02}
.d2{font-size:clamp(2rem,3.6vw,3.1rem);text-transform:uppercase;letter-spacing:.09em;font-weight:300}
.d3{font-size:clamp(1.4rem,2.2vw,1.9rem);text-transform:uppercase;letter-spacing:.1em;font-weight:300}
.h4{font-size:1.02rem;text-transform:uppercase;letter-spacing:.14em;font-weight:400}
.num{font-size:3.4rem;font-weight:300;line-height:1;letter-spacing:0}
.num sup{font-size:.9rem;vertical-align:top;margin-left:6px;color:var(--mute)}
.numlabel{display:flex;align-items:flex-start;gap:10px}
p{line-height:1.75;margin:0 0 1em;color:var(--ivory2)}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.rule{height:1px;background:var(--line);flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 28px;border:1px solid var(--ivory2);border-radius:var(--pill);background:transparent;color:var(--ivory);font-size:.78rem;text-transform:uppercase;letter-spacing:.24em;cursor:pointer;transition:.2s;white-space:nowrap;word-spacing:.2em}
.btn:hover{background:var(--ivory);color:var(--ink)}
.btn.fill{background:var(--ox);border-color:var(--ox2)}
.btn.fill:hover{background:var(--ox2);color:var(--ivory)}
.btn.ivory{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.btn.ivory:hover{background:transparent;color:var(--ivory)}
.btn.ghost{border-color:var(--line2);color:var(--ivory2)}
.btn.sm{height:34px;padding:0 18px;font-size:.68rem;letter-spacing:.2em}
.btn.xs{height:28px;padding:0 12px;font-size:.64rem;letter-spacing:.16em}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .ic{width:15px;height:15px}
.link{color:var(--ivory);border-bottom:1px solid var(--line2);padding-bottom:1px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.link:hover{border-color:var(--ox2);color:var(--ivory)}
.link.ox{color:var(--oxt);border-color:transparent}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:inline-grid;place-items:center;background:transparent;cursor:pointer;color:var(--ivory);position:relative;transition:.2s}
.iconbtn:hover{border-color:var(--ivory2)}
.iconbtn.fill{background:var(--ox);border-color:var(--ox2)}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--ox2);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--pill);font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ivory2);white-space:nowrap}
.chip.ox{border-color:var(--ox);background:var(--oxd);color:var(--ivory)}
.chip.iv{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:#3f6b50;color:var(--ok)}
.chip.on{background:var(--ivory);color:var(--ink)}
button.chip{cursor:pointer;background:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.off{background:var(--mute2)}
/* top line & header */
#topline{border-bottom:1px solid var(--line);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
#topline .wrap{display:flex;justify-content:space-between;align-items:center;height:34px;gap:16px}
#topline a:hover{color:var(--ivory)}
#hdr{position:sticky;top:0;z-index:40;background:rgba(11,10,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#hdr .wrap{display:flex;align-items:center;height:76px;gap:28px}
.brand{display:inline-flex;align-items:center;height:44px}
.logo{font-family:var(--sans);font-weight:300;letter-spacing:.56em;margin-right:-.56em;font-size:21px;line-height:1;color:var(--ivory);white-space:nowrap}
nav.main{display:flex;gap:26px;flex:1;justify-content:center}
nav.main>div{position:relative}
nav.main a.nl{font-size:.72rem;text-transform:uppercase;letter-spacing:.22em;color:var(--ivory2);padding:28px 0;display:block;border-bottom:1px solid transparent}
nav.main a.nl:hover,nav.main a.nl.on{color:var(--ivory)}
nav.main a.nl.on{border-bottom-color:var(--ox2)}
.mega{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:760px;background:var(--ink2);border:1px solid var(--line);padding:28px;display:none;grid-template-columns:1fr 1fr 240px;gap:10px 28px;z-index:50}
nav.main>div:hover .mega,nav.main>div:focus-within .mega{display:grid}
.mega a{font-size:.8rem;color:var(--ivory2);padding:6px 0;display:block}
.mega a:hover{color:var(--oxt)}
.mega .feat{grid-row:span 6;border-left:1px solid var(--line);padding-left:24px}
.hdr-ic{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line2);background:var(--ink3)}
.avatar.lg{width:64px;height:64px}.avatar.xl{width:96px;height:96px}.avatar.sm{width:28px;height:28px}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:300px;background:var(--ink2);border:1px solid var(--line);z-index:60;padding:8px 0;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 18px;font-size:.84rem;color:var(--ivory2);background:none;border:0;text-align:left;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--ink3);color:var(--ivory)}
.menu .sep{height:1px;background:var(--line);margin:6px 0}
.menu .who{padding:12px 18px 14px;display:flex;gap:12px;align-items:center}
.burger{display:none}
#ticker{border-bottom:1px solid var(--line);overflow:hidden;height:34px;display:flex;align-items:center;background:var(--ink)}
#ticker .lab{flex:none;padding:0 16px;height:100%;display:flex;align-items:center;gap:8px;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;background:var(--ox);color:var(--ivory)}
#ticker .tr{white-space:nowrap;display:flex;gap:48px;animation:tick 90s linear infinite;padding-left:24px;font-size:.74rem;color:var(--ivory2)}
#ticker .tr span::before{content:'✦';color:var(--ox2);margin-right:12px;font-size:.6rem}
#ticker:hover .tr{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{min-height:60vh;outline:none}
/* hero */
.hero{position:relative;min-height:640px;height:calc(100vh - 144px);max-height:860px;overflow:hidden;border-bottom:1px solid var(--line)}
.band{border-bottom:1px solid var(--line)}
.sec{padding-top:96px;padding-bottom:96px}
.sec.tight{padding-top:64px;padding-bottom:64px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px}
.sec-head .d2,.sec-head .d3{margin:0}
.split{display:grid;grid-template-columns:400px 1fr;gap:56px;align-items:start}
.split.rev{grid-template-columns:1fr 400px}
.split.half{grid-template-columns:1fr 1fr}
.portrait-frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ink3)}
.portrait-frame img{width:100%;height:100%;object-fit:cover}
/* ticket card (inspo) */
.ticket{background:var(--ivory);color:var(--ink);display:grid;grid-template-columns:120px 1px 1fr auto;gap:22px;padding:20px 26px;align-items:center}
.ticket .vr{background:#c7bdb1;height:100%}
.ticket img{width:120px;height:150px;object-fit:cover}
.ticket .t1{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.ticket .t2{font-size:1.25rem;color:var(--ox);letter-spacing:.06em;font-weight:500;line-height:1.15;margin:16px 0}
.ticket .big{font-size:5.2rem;color:var(--ox);font-weight:300;line-height:1;letter-spacing:-.02em}
.ticket .mini{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.circ{width:120px;height:120px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* grids & cards */
.grid{display:grid;gap:28px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.mcard{position:relative;display:block;background:var(--ink2);overflow:hidden;cursor:pointer}
.mcard .ph{aspect-ratio:3/4;overflow:hidden;position:relative}
.mcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.mcard:hover .ph img{transform:scale(1.04)}
.mcard .ov{position:absolute;inset:auto 0 0 0;padding:16px 16px 14px;background:linear-gradient(transparent,rgba(5,4,4,.92))}
.mcard .nm{font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
.mcard .meta{font-size:.74rem;color:var(--ivory2);margin-top:2px}
.mcard .tl{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.mcard .tr{position:absolute;top:12px;right:12px}
.mcard .ln{font-family:var(--serif);font-style:italic;font-size:1.04rem;color:var(--ivory2);margin-top:6px;line-height:1.3}
.pcard{display:block;cursor:pointer}
.pcard .ph{aspect-ratio:4/3;overflow:hidden;background:var(--ink3);position:relative}
.pcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.pcard:hover .ph img{transform:scale(1.05)}
.pcard .b{padding:14px 0 0}
.pcard .br{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.pcard .nm{font-size:.94rem;margin:4px 0 6px;line-height:1.35}
.pcard .pr{font-size:.9rem;color:var(--ivory)}
.pcard .ed{position:absolute;left:12px;bottom:12px}
.gcard{display:block;border:1px solid var(--line);background:var(--ink2);transition:.2s}
.gcard:hover{border-color:var(--line2)}
.gcard .top{display:flex;gap:16px;padding:18px}
.gcard .top img{width:72px;height:90px;object-fit:cover}
.gcard .bot{border-top:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute)}
.bar{height:3px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ox2);transition:width .6s}
.bar.lg{height:6px}
.bar.gold i{background:var(--gold)}
.panel{border:1px solid var(--line);background:var(--ink2);padding:24px}
.panel.iv{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.panel.iv p,.panel.iv .mute,.panel.iv .num sup{color:#554c47}
.panel h3{font-size:.86rem;text-transform:uppercase;letter-spacing:.18em;margin-bottom:16px}
.stat{padding:22px;border:1px solid var(--line);background:var(--ink2)}
.stat .v{font-size:2rem;font-weight:300;letter-spacing:.01em;margin-top:6px}
.stat .s{font-size:.74rem;color:var(--mute);margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;font-size:.88rem}
.kv dt{color:var(--mute)} .kv dd{margin:0;text-align:right}
.list{border-top:1px solid var(--line)}
.li{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.li.click{cursor:pointer}.li.click:hover{background:linear-gradient(90deg,transparent,var(--ink2),transparent)}
.li .t{font-size:.92rem}.li .s{font-size:.78rem;color:var(--mute);margin-top:2px}
.li.unread .t{color:var(--ivory);font-weight:500}
.li.unread::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ox2);flex:none;margin-left:-14px}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--ivory2)} .amt.pos{color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{text-align:left;font-weight:400;font-size:.66rem;text-transform:uppercase;letter-spacing:.18em;color:var(--mute);padding:12px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.015)}
table.t .r{text-align:right}
/* forms */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.field label{font-size:.66rem;text-transform:uppercase;letter-spacing:.2em;color:var(--mute)}
.inp,select.inp,textarea.inp{width:100%;height:46px;background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;color:var(--ivory);outline:none;transition:.2s}
textarea.inp{height:auto;min-height:110px;padding:12px 14px;line-height:1.6;resize:vertical}
.inp:focus{border-color:var(--ivory2)}
.inp.err{border-color:var(--bad)}
.ferr{font-size:.76rem;color:var(--bad)}
.fhint{font-size:.74rem;color:var(--mute2)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frow3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--ivory2);cursor:pointer;margin-bottom:12px;line-height:1.5}
.check input{accent-color:var(--ox);width:16px;height:16px;margin-top:3px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--pill);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:32px;padding:0 16px;border-radius:var(--pill);font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ivory2);cursor:pointer}
.seg button.on{background:var(--ivory);color:var(--ink)}
.opt{display:flex;gap:14px;align-items:center;border:1px solid var(--line);padding:14px 16px;cursor:pointer;margin-bottom:10px;transition:.2s;background:var(--ink2)}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--ivory2);background:var(--ink3)}
.opt input{accent-color:var(--ox)}
.saved{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--mute);margin:-4px 0 16px;cursor:pointer;width:max-content}
.saved:hover{color:var(--ivory)}
.saved .ic{width:14px;height:14px;color:var(--gold)}
.range{width:100%;accent-color:var(--ox)}
.toggle{position:relative;width:40px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle i{position:absolute;inset:0;border-radius:11px;background:var(--line2);transition:.2s;cursor:pointer}
.toggle i::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ivory);transition:.2s}
.toggle input:checked+i{background:var(--ox)}
.toggle input:checked+i::after{left:21px}
/* layer / modal */
#layer:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,4,4,.78);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
.modal{background:var(--ink2);border:1px solid var(--line);width:100%;max-width:520px;max-height:calc(100vh - 48px);overflow:auto;position:relative;animation:rise .25s}
.modal.mid{max-width:680px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:.9rem;text-transform:uppercase;letter-spacing:.2em}
.modal .mb{padding:26px}
.modal .mf{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
#toasts{position:fixed;right:24px;bottom:24px;z-index:120;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ivory);color:var(--ink);padding:14px 18px;min-width:280px;max-width:380px;font-size:.84rem;display:flex;gap:12px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:rise .3s;cursor:pointer}
.toast img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.toast.dark{background:var(--ink3);color:var(--ivory);border:1px solid var(--line2)}
.toast.sms{background:#1d1d1f;color:#fff;border-radius:16px;border:1px solid #333}
.toast .tt{font-weight:500}
.toast .ts{font-size:.76rem;opacity:.75}
/* footer */
#ftr{border-top:1px solid var(--line);margin-top:0}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:32px;padding:56px 0}
.fcols h5{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:400;margin:0 0 16px}
.fcols a{display:block;font-size:.84rem;color:var(--ivory2);padding:5px 0}
.fcols a:hover{color:var(--ivory)}
.fbase{border-top:1px solid var(--line);padding:22px 0;font-size:.72rem;color:var(--mute2);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.datesig{display:flex;align-items:center;gap:28px;padding:40px 0}
.datesig b{font-weight:600;font-size:.76rem;letter-spacing:.06em;display:block}
/* account layout */
.acct{display:grid;grid-template-columns:230px 1fr;gap:48px;padding:48px 0 96px}
.side a{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:.84rem;color:var(--ivory2);border-bottom:1px solid var(--line)}
.side a:hover,.side a.on{color:var(--ivory)}
.side a.on{border-bottom-color:var(--ox2)}
.side .cnt{font-size:.66rem;background:var(--ox);padding:2px 7px;border-radius:9px;color:#fff}
.side h6{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--mute2);margin:24px 0 6px;font-weight:400}
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.ph-head h1{margin:0}
/* inbox */
.inbox{display:grid;grid-template-columns:340px 1fr;border:1px solid var(--line);height:calc(100vh - 260px);min-height:560px;background:var(--ink2)}
.ilist{border-right:1px solid var(--line);overflow:auto}
.ilist .it{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.ilist .it:hover{background:var(--ink3)}
.ilist .it.on{background:var(--ink3);box-shadow:inset 2px 0 0 var(--ox2)}
.ilist .it .nm{font-size:.86rem;display:flex;justify-content:space-between;gap:8px}
.ilist .it .pv{font-size:.78rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ilist .it.unread .pv{color:var(--ivory)}
.ilist .it .ud{position:absolute;right:14px;bottom:18px;width:8px;height:8px;border-radius:50%;background:var(--ox2)}
.ithread{display:flex;flex-direction:column;min-width:0}
.ithread .th{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.msgs{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:68%;padding:10px 14px;font-size:.88rem;line-height:1.55;background:var(--ink3);border:1px solid var(--line);align-self:flex-start;border-radius:16px 16px 16px 4px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--ox);border-color:var(--ox2);border-radius:16px 16px 4px 16px}
.msg .tm{display:block;font-size:.66rem;color:rgba(242,237,230,.72);margin-top:4px}
.dayline{align-self:center;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute2);margin:14px 0}
.typing{align-self:flex-start;padding:12px 16px;background:var(--ink3);border-radius:16px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.card-msg{align-self:flex-start;width:300px;border:1px solid var(--line2);background:var(--ink);padding:16px}
.card-msg.me{align-self:flex-end}
.card-msg .k{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:140px;height:44px;resize:none;background:var(--ink);border:1px solid var(--line);border-radius:22px;padding:11px 18px;color:var(--ivory);outline:none;line-height:1.5}
.photo-msg{width:220px;aspect-ratio:3/4;position:relative;overflow:hidden;border:1px solid var(--line2);cursor:pointer}
.photo-msg img{width:100%;height:100%;object-fit:cover}
.photo-msg.locked{background:radial-gradient(120% 90% at 30% 20%,#6b1d2a 0%,#3b1218 45%,#160b0c 100%)}
.photo-msg.locked img{opacity:0}
.photo-msg .lk{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase}
/* velvet posts */
.post{border:1px solid var(--line);background:var(--ink2)}
.post .media{aspect-ratio:4/5;position:relative;overflow:hidden}
.post .media img{width:100%;height:100%;object-fit:cover}
.post.locked .media{background:radial-gradient(120% 90% at 30% 15%,#7a2230 0%,#43141c 42%,#170b0d 100%)}
.post.locked .media::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.post.locked .media img{opacity:0}
.post .media .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.post .media .cnt{position:absolute;right:10px;top:10px}
.post .b{padding:14px 16px}
/* stepper */
.steps{display:flex;gap:0;margin-bottom:36px;border-bottom:1px solid var(--line)}
.steps div{flex:1;padding:14px 0;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute2);border-bottom:1px solid transparent;margin-bottom:-1px}
.steps div.on{color:var(--ivory);border-color:var(--ox2)}
.steps div.done{color:var(--ivory2)}
.timeline{border-left:1px solid var(--line2);margin-left:6px;padding-left:22px}
.timeline .ev{position:relative;padding-bottom:18px}
.timeline .ev::before{content:'';position:absolute;left:-27px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:1px solid var(--ivory2)}
.timeline .ev.on::before{background:var(--ox2);border-color:var(--ox2)}
.timeline .ev .s{font-size:.76rem;color:var(--mute)}
.summary{position:sticky;top:110px}
.sumrow{display:flex;justify-content:space-between;padding:7px 0;font-size:.88rem}
.sumrow.tot{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:1.05rem}
/* document (terms / receipts) */
.doc{background:var(--ivory);color:#1a1514;padding:56px 64px;font-size:.92rem;line-height:1.7;position:relative}
.doc p{color:#3a3330}
.doc h2{color:var(--ox);font-size:1rem;letter-spacing:.24em;text-transform:uppercase}
.doc .sig{font-family:var(--script);font-size:2.2rem;color:#1d2a5a;line-height:1}
.doc .stamp{z-index:1;position:absolute;right:48px;top:48px;width:110px;height:110px;border:3px double var(--ox);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--ox);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;transform:rotate(-12deg);opacity:.75;font-weight:600}
.doc table{width:100%;border-collapse:collapse;font-size:.86rem}
.doc td,.doc th{padding:9px 0;border-bottom:1px solid #d6cdc2;text-align:left}
.doc th{font-weight:500;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#7a706a}
.doc .r{text-align:right}
/* misc */
.empty{padding:56px 24px;text-align:center;border:1px dashed var(--line2);color:var(--mute)}
.empty .ic{width:28px;height:28px;color:var(--mute2);margin-bottom:10px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto}
.tabs a,.tabs button{padding:14px 0;font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;color:var(--mute);border:0;background:none;border-bottom:1px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs a.on,.tabs button.on{color:var(--ivory);border-color:var(--ox2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.filters select.inp{height:38px;width:auto;min-width:140px;font-size:.8rem}
.crumb{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:28px 0}
.crumb a:hover{color:var(--ivory)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in}
.gallery img:first-child{grid-column:span 2;aspect-ratio:4/5}
.pgallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgallery img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pgallery img:first-child{grid-column:span 2}
.quote{font-family:var(--serif);font-style:italic;font-size:1.7rem;line-height:1.35;color:var(--ivory)}
.tagline{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--ivory2)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:130;display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-height:92vh;max-width:92vw}
.countdown{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.livebox{border:1px solid var(--line);background:var(--ink2);display:grid;grid-template-columns:1fr 340px;min-height:560px}
.livebox .stage{position:relative;overflow:hidden}
.livebox .stage img{width:100%;height:100%;object-fit:cover}
.livebox .chat{border-left:1px solid var(--line);display:flex;flex-direction:column}
.livebox .feed{flex:1;overflow:auto;padding:14px;font-size:.82rem;display:flex;flex-direction:column;gap:8px}
.livebox .feed .tipline{color:var(--gold)}
.livepill{position:absolute;left:16px;top:16px;display:flex;gap:8px}
.livepill span{background:var(--ox2);color:#fff;font-size:.64rem;letter-spacing:.2em;padding:4px 10px;text-transform:uppercase}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.heat i{aspect-ratio:1;background:var(--ox);display:block}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;border-bottom:1px solid var(--line);padding-top:10px}
.chart div{flex:1;background:var(--ox);position:relative;min-height:2px;transition:height .6s}
.chart div:hover{background:var(--ox2)}
.chart div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--ivory2);white-space:nowrap}
#cover{position:fixed;inset:0;z-index:999;background:#fff;color:#222;font-family:Georgia,serif}

  S.JOURNAL = [
    { id: 'j1', title: 'The art of the first dinner', kicker: 'Etiquette', mins: 5, lede: 'What to order, what to ask, and when to let the silence work.', body: ['The first dinner is not an interview. It is a rehearsal for every evening that might follow it, and the best ones feel unhurried even when both people are watching the clock.', 'Choose the place together, but let the person with the stronger opinion win. Arrive five minutes early and take the seat facing the room — not for power, but so the other person has the view.', 'Talk about what you are building. Patrons respond to ambition; Muses respond to attention. Nobody responds to a résumé recited over the bread.', 'Money comes up when it comes up. If you are the Patron, raise it lightly and early — it is a kindness. If you are the Muse, it is entirely acceptable to say you would like to talk about it before dessert.', 'End the evening while it is still going well. The best first dinners are the ones that leave something unfinished.'] },
    { id: 'j2', title: 'Why allowances work better in escrow', kicker: 'Arrangements', mins: 4, lede: 'Trust is easier when nobody has to ask twice.', body: ['The awkward moment in most arrangements is the transfer. Somebody has to remember, somebody has to ask, and somebody inevitably feels small.', 'SOVÉ escrow removes the moment. The Patron funds the month in advance, both people confirm the evenings they shared, and the allowance releases on its own date.', 'If an evening is missed, the arrangement pauses rather than breaks. If it ends, it ends gracefully, with whatever was promised paid.', 'Six months in, members tell us the same thing: they stopped thinking about money and started thinking about each other.'] },
    { id: 'j3', title: 'Tuition, paid directly: inside the Ledger', kicker: 'Patronage', mins: 6, lede: 'Last term SOVÉ Patrons sent $14.2M straight to bursars. Here is how.', body: ['The Ledger began with one request: a law student in Los Angeles who wanted help with tuition but did not want cash. She wanted the receipt.', 'Direct-to-institution patronage pays the school, the landlord, the flight academy. The Muse uploads the invoice; SOVÉ verifies it; the funds never touch a personal account.', 'Patrons like it because the help is visible. Muses like it because the help is undeniable. Everybody likes the end-of-term photo with the transcript.', 'The most-funded categories this year: law school, nursing, pilot licences and first studio leases.'] },
    { id: 'j4', title: 'The Gilded List, explained', kicker: 'Community', mins: 3, lede: 'Generosity, ranked. Discreetly.', body: ['Every month SOVÉ publishes the Patrons who gave the most — to Wishes, to Muses, to creators — city by city.', 'Names appear as members choose: full name, initials, or simply "A Patron in Zurich". The ranking is the point, not the publicity.', 'The top ten in each city receive an invitation to the next private Salon and first refusal on Maison allocations.'] },
    { id: 'j5', title: 'After Dark: a creator\'s week', kicker: 'The Velvet', mins: 5, lede: 'Charlotte Monroe on lighting, boundaries and the subscribers who stay.', body: ['"People think it\'s about being undressed," Charlotte says. "It\'s about being consistent."', 'She shoots three days a week in the same Miami apartment, posts every day, and answers every VIP message herself before noon.', 'Her boundaries are written into her Velvet profile and she does not move them for money. "The ones who respect that are the ones who renew."', 'Her advice to new creators: price your After Dark tier higher than feels comfortable, and never, ever post the best set first.'] },
    { id: 'j6', title: 'Ten gifts that are never returned', kicker: 'The Maison', mins: 4, lede: 'From the LOVE bracelet to a week in St-Barth.', body: ['The LOVE bracelet, because it requires a screwdriver to remove.', 'A Kelly in a colour she would never have chosen for herself.', 'A first-edition of the book she quoted on your second date.', 'A night at the Hôtel de Paris during Grand Prix week.', 'The perfume she wears, in the size nobody buys for themselves.', 'Lessons — flying, sailing, singing — anything that becomes part of who she is.', 'A paid-off student loan, delivered as a printed letter in an envelope.', 'A painting by somebody she discovered before you did.', 'The watch you wear, in her size.', 'Time. Specifically, the weekend you cleared for her.'] },
  ];

  S.FAQ = [
    ['What is SOVÉ?', 'A private members\' house for Patrons, Muses and creators. Members meet, arrange, fund one another\'s ambitions, shop the Maison and subscribe to the Velvet — all under one discreet roof.'],
    ['Who can join?', 'Adults aged 21 and over in our launch cities. Patrons verify identity and income; Muses verify identity and, for Wishes, the documents behind them.'],
    ['How is my identity verified?', 'A government ID and a live selfie, matched in under two minutes. Patrons additionally verify income through a bank statement or accountant letter. Documents are deleted after review.'],
    ['What does "Patron" and "Muse" mean?', 'Patrons are the generous side of an arrangement — Daddies and Mommies, if you prefer the tags. Muses are the side being spoiled, of any gender. Creators are Muses who also publish to the Velvet.'],
    ['How do allowances work?', 'Arrangements are agreed in a written Terms of Arrangement. The Patron funds each month into escrow; the allowance releases after both sides confirm their evenings together.'],
    ['What is a Wish?', 'A funding goal posted to the Ledger — tuition, a studio lease, a pilot licence. Patrons fund it in full or in part. Many Wishes pay the institution directly.'],
    ['How does the Maison deliver gifts?', 'Boutique pieces arrive by insured courier in discreet packaging. Cars and allocations are handled by a SOVÉ advisor with a delivery timeline. Recipients may accept, decline or consign any gift.'],
    ['What appears on my card statement?', '"SVH SERVICES LTD" — nothing else. You can also pay from your SOVÉ Balance or by wire.'],
    ['Can I stay hidden?', 'Yes. Hidden mode removes you from the Register; Obsidian members can choose exactly who sees their profile. The panic key (Esc twice) replaces the page instantly.'],
    ['What is After Dark?', 'Restricted creator collections, sealed until unlocked. Available only to verified members who have opted in to sensitive content.'],
    ['How do Muses get paid?', 'Earnings from gifts you consign, allowances, Velvet subscriptions and tips settle to your Balance and pay out to your bank every Friday, or instantly for a small fee.'],
    ['What are SOVÉ\'s fees?', 'Patrons pay membership. Wishes carry a 12% platform fee (8% for Muse Elite). Creators keep 80% of Velvet earnings. Maison prices include our service.'],
    ['Can I cancel an arrangement?', 'Either side may pause or end an arrangement at any time. Escrowed funds for evenings already confirmed are always paid; the rest is returned to the Patron.'],
    ['What if someone asks me to pay off-platform?', 'Never do it. Report the conversation. SOVÉ will never ask you for gift cards, crypto transfers or "verification fees".'],
    ['Do you operate in my city?', 'New York, Los Angeles, Miami, London, Monaco, Zurich, Dubai, Toronto, Sydney and Singapore. More in 2027.'],
    ['How do I contact a person?', 'Concierge is available 24/7 from Help, by message, or by phone for Gilded and Obsidian members.'],
  ];

    terms: { title: 'Terms of Membership', updated: 'October 1, 2026', body: ['These Terms govern your membership of SOVÉ, operated by SVH Services Ltd ("SOVÉ", "we"). By creating an account you confirm you are at least 21 years old and legally able to enter into this agreement in your jurisdiction.', 'Membership is personal and non-transferable. You are responsible for the accuracy of your profile, the security of your sign-in and every action taken from your account.', 'SOVÉ provides introductions, payment services, escrow, a marketplace and a creator platform. We are not a party to arrangements between members and do not guarantee any outcome of any introduction.', 'Arrangements must be lawful in the place they occur. SOVÉ prohibits the exchange of money for sexual services. Allowances, gifts and patronage are made freely and are not consideration for any specific act.', 'You must not solicit payment off-platform, impersonate anyone, harass any member, or publish content you do not own or have consent to publish.', 'Membership fees renew automatically until cancelled. Wishes, gifts and allowances are final once released, except as described in our Refund Policy.', 'We may suspend or close accounts that breach these Terms. Funds lawfully owed to you will be paid out after any investigation concludes.', 'These Terms are governed by the laws of England and Wales. Disputes are resolved by arbitration in London, except where local consumer law gives you the right to go to court.'] },
    privacy: { title: 'Privacy Policy', updated: 'September 12, 2026', body: ['We collect what we need to run a private members\' house: your identity, verification results, profile, messages, transactions and device information.', 'Identity documents are processed by our verification partner and deleted within 30 days of a decision. We keep the result, not the document.', 'Messages are encrypted in transit and at rest. SOVÉ staff access them only when you report a conversation or when the law requires.', 'We never sell your data. We share it only with payment, verification and delivery partners, under contract, to provide the service.', 'You can download everything we hold about you from Settings → Privacy, and delete your account at any time.', 'Hidden mode, incognito browsing and the panic key are designed to protect your discretion on shared devices.'] },
    guidelines: { title: 'Community Guidelines', updated: 'August 3, 2026', body: ['Be generous, be honest, be discreet.', 'Respect boundaries. A boundary listed on a profile is not an opening position.', 'No minors, ever. Every member is verified as 21 or over.', 'No solicitation of payment for sexual services. Arrangements are about companionship, mentorship and generosity.', 'No off-platform payment requests, gift-card scams, "verification fees" or investment pitches.', 'No sharing another member\'s photos, messages or identity outside SOVÉ.', 'Report anything that feels wrong. Concierge reviews every report within an hour.'] },
    creator: { title: 'Creator Terms', updated: 'October 18, 2026', body: ['Creators must be verified Muses and must hold the rights and documented consent for every person appearing in their content.', 'After Dark content must be tagged as restricted. It is shown only to verified members who have opted in and stays sealed until unlocked.', 'Creators keep 80% of subscriptions, unlocks, tips and custom requests. SOVÉ retains 20%, which covers payment processing, hosting and moderation.', 'Payouts settle weekly to the creator\'s Balance and bank. Chargebacks are deducted from future earnings.', 'We may remove content that breaches our Guidelines. Repeated breaches close the creator studio.'] },
    refunds: { title: 'Refund Policy', updated: 'July 21, 2026', body: ['Maison boutique pieces may be returned unworn within 14 days of delivery. Allocations, bespoke items and engraved pieces are final.', 'Stays and experiences follow the cancellation terms shown at booking.', 'Wishes are refunded in full if the goal is cancelled or does not reach its target by its deadline.', 'Escrowed allowances for unconfirmed evenings are returned to the Patron when an arrangement ends.', 'Membership fees are non-refundable once a billing period has begun; cancelling stops the next renewal.', 'Refunds to your SOVÉ Balance are instant and carry a 10% bonus; refunds to card take 5–10 business days.'] },

  // ---------- wishes ----------
  C.fundGoal = function (mid, gid, amount, anon, t, background, method, cardId, match) {
    const g = S.state.goals.find(x => x.id === gid); if (!g || g.status !== 'open') return { ok: false, error: 'This Wish is no longer open.' };
    amount = Math.round(Math.min(amount, g.amount - g.raised));

    if (!background) { const pc = C.precheck(mid, amount, method || 'balance', cardId); if (!pc.ok) return pc; }
    const tt = t || S.now();

    g.raised += amount; g.backers.push({ mid, amt: amount, t: tt, anon: !!anon, match: match || 0 });
    if (background || !method || method === 'balance') S.addTx(mid, -amount, 'wish', 'Wish · ' + g.title, tt, { ref: g.id });

    const fee = owner.tier === 'elite' ? S.FEES.eliteFee : S.FEES.platform;

    const who = anon ? 'An anonymous Patron' : S.mem(mid).first + ' ' + S.mem(mid).last[0] + '.';
    const back = tt < S.now() - 5000 ? tt : undefined;
    S.notify(g.owner, 'wish', who + ' contributed ' + S.$0(amount) + ' to your Wish', '#/ledger/' + g.id, back);
    const after = g.raised / g.amount;
    g.milestones.forEach(ms => { if (before < ms.p && after >= ms.p && ms.p < 1) { S.ticker(S.fill(S.TICKER_TPL.goal[2], { title: g.title, pct: Math.round(ms.p * 100) }), back); S.notify(g.owner, 'wish', 'Your Wish just passed ' + Math.round(ms.p * 100) + '%', '#/ledger/' + g.id, back); } });

    }

    else { const other = who === a.patron ? a.muse : a.patron; S.notify(other, 'arrangement', S.mem(who).first + ' signed the Terms. Your signature is the last one.', '#/arrangement/' + aid); }

  // ---------- Velvet ----------
  C.subscribe = function (fan, creator, tier, promo, t, method, cardId) {
    const tr = S.CREATOR_TIERS.find(x => x.id === tier); let price = tr.price;
    if (promo && String(promo).toUpperCase() === 'VELVET15' && !(S.state.promoUsed[fan] || []).includes('VELVET15')) { price = S.round2(price * 0.85); (S.state.promoUsed[fan] = S.state.promoUsed[fan] || []).push('VELVET15'); }
    else if (promo) return { ok: false, error: 'That code isn\'t valid for subscriptions.' };
    const back = t && t < S.now() - 5000;
    if (!back && method) { const pc = C.precheck(fan, price, method, cardId); if (!pc.ok) return pc; }
    const ex = S.state.subs.find(s => s.fan === fan && s.creator === creator && s.status === 'active');
    if (ex) { ex.tier = tier; } else S.state.subs.push({ id: S.uid('SB'), fan, creator, tier, since: back ? t : S.now(), renew: (back ? t : S.now()) + 30 * S.DAY, status: 'active' });
    if (!method || method === 'balance') S.addTx(fan, -price, 'subscription', tr.name + ' · ' + S.mem(creator).first + ' ' + S.mem(creator).last[0] + '.', back ? t : null);
    else C.capture(fan, price, method, cardId, 'subscription', tr.name + ' · ' + S.mem(creator).first);
    S.addTx(creator, S.round2(price * 0.8), 'earning', 'Subscription · ' + S.mem(fan).first + ' ' + S.mem(fan).last[0] + '.', back ? t : null);
    S.mem(creator).creatorInfo.fans++;
    S.state.score[fan] = (S.state.score[fan] || 0) + price;
    S.notify(creator, 'sub', S.mem(fan).first + ' joined your ' + tr.name, '#/account/studio', back ? t : undefined);
    if (S.isNPC(creator) && !back) S.schedule('npcSay', S.now() + (3 + Math.random() * 30) * S.MIN, { npc: creator, to: fan, lines: [S.Voice.style(S.mem(creator), S.pickOne(['Welcome to my ' + tr.name + ' {emoji} you\'re going to like it here.', 'Hiii, thank you for subscribing! Tell me what you want to see next 😘', 'You found my ' + tr.name + '. Start with the newest set.']))] });
    S.save(); return { ok: true, price };
  };
  C.cancelSub = function (sid) { const s = S.state.subs.find(x => x.id === sid); if (s) { s.status = 'cancelled'; s.cancelled = S.now(); S.save(); } };
  C.renewSub = function (s) {
    const tr = S.CREATOR_TIERS.find(x => x.id === s.tier);
    if (S.isNPC(s.fan) && Math.random() < 0.08) { s.status = 'cancelled'; return; }
    if (S.wallet(s.fan).bal < tr.price && !S.isNPC(s.fan)) { s.status = 'past_due'; S.notify(s.fan, 'sub', 'Your subscription to ' + S.mem(s.creator).first + ' couldn\'t renew', '#/account/subscriptions'); return; }
    S.addTx(s.fan, -tr.price, 'subscription', tr.name + ' renewal · ' + S.mem(s.creator).first);
    S.addTx(s.creator, S.round2(tr.price * 0.8), 'earning', 'Renewal · ' + S.mem(s.fan).first);
    s.renew += 30 * S.DAY;
  };
  C.hasAccess = function (fan, post) {
    if (!fan) return post.tier === 'public';
    if (fan === post.creator || post.tier === 'public') return true;
    if ((S.state.unlocks[fan] || []).includes(post.id)) return true;
    const s = S.state.subs.find(x => x.fan === fan && x.creator === post.creator && x.status === 'active');
    if (!s) return false;
    if (post.tier === 'sub') return true;
    if (post.tier === 'dark') return s.tier === 'dark' || s.tier === 'vip';
    return false;

  C.unlock = function (fan, postId, t) {

  // ---------- auctions ----------
  C.topBid = a => a.bids.slice().sort((x, y) => y.amt - x.amt)[0];
  C.minBid = a => { const t = C.topBid(a); return t ? t.amt + (t.amt >= 10000 ? 500 : 250) : Math.round(a.reserve * 0.6); };
  C.bid = function (mid, aid, amt) {
    const a = S.state.auctions.find(x => x.id === aid); if (!a || a.status !== 'live') return { ok: false, error: 'This auction has closed.' };
    if (amt < C.minBid(a)) return { ok: false, error: 'Minimum bid is ' + S.$0(C.minBid(a)) + '.' };
    if (S.wallet(mid).bal < amt) return { ok: false, error: 'Your Balance must cover your bid (' + S.$0(amt) + ').' };
    const prev = C.topBid(a);
    a.bids.push({ mid, amt, t: S.now() });
    if (prev && prev.mid !== mid && !S.isNPC(prev.mid)) S.notify(prev.mid, 'auction', 'Outbid on “' + a.title + '”', '#/auction/' + aid);
    if (a.ends - S.now() < 10 * S.MIN) a.ends = S.now() + 10 * S.MIN;
    // a rival may answer
    const rivals = a.bids.filter(b => b.mid !== mid && S.isNPC(b.mid)).map(b => b.mid);
    const rival = rivals.length ? S.pickOne(rivals) : null;
    if (rival && Math.random() < 0.7) { const max = Math.round(amt * (1.05 + Math.random() * 0.35)); S.schedule('npcCounterBid', S.now() + (1 + Math.random() * 8) * S.MIN, { auction: aid, npc: rival, max }); }
    S.save(); return { ok: true };
  };
  C.npcCounterBid = function (aid, npc, max) {
    const a = S.state.auctions.find(x => x.id === aid); if (!a || a.status !== 'live') return;
    const top = C.topBid(a); if (!top || top.mid === npc) return;
    const next = C.minBid(a); if (next > max) return;
    a.bids.push({ mid: npc, amt: next, t: S.now() });
    if (!S.isNPC(top.mid)) S.notify(top.mid, 'auction', S.mem(npc).first + ' outbid you on “' + a.title + '” — ' + S.$0(next), '#/auction/' + aid);
  };
  C.closeAuction = function (a) {
    a.status = 'closed'; const top = C.topBid(a);
    if (!top || top.amt < a.reserve) { a.result = 'Reserve not met'; S.ticker('“' + a.title + '” closed without meeting reserve'); return; }
    a.winner = top.mid; a.result = 'Won by ' + S.mem(top.mid).first + ' at ' + S.$0(top.amt);
    S.addTx(top.mid, -top.amt, 'auction', 'Dinner Auction · ' + a.title, null, { ref: a.id });
    S.addTx(a.muse, S.round2(top.amt * 0.5), 'auction', 'Dinner Auction proceeds (50%; 50% to ' + a.charity + ')', null, { ref: a.id });
    S.state.score[top.mid] = (S.state.score[top.mid] || 0) + top.amt;
    S.notify(top.mid, 'auction', 'You won “' + a.title + '” at ' + S.$0(top.amt), '#/auction/' + a.id);
    S.notify(a.muse, 'auction', S.mem(top.mid).first + ' won your Dinner Auction at ' + S.$0(top.amt), '#/auction/' + a.id);
    S.ticker('“' + a.title + '” — won at ' + S.$0(top.amt));
    const d = { id: S.uid('D'), a: top.mid, b: a.muse, venue: S.pickOne(S.VENUES[a.city]), city: a.city, t: S.now() + 5 * S.DAY, status: 'booked', confirmed: {} };
    S.state.dates.push(d);
    // a fresh auction appears to keep the room alive
    const pool = S.allMembers().filter(m => m.role === 'muse' && m.tier !== 'rising' && !S.state.auctions.some(x => x.muse === m.id && x.status === 'live'));
    const m = S.pickOne(pool); if (m) S.state.auctions.push({ id: 'AU' + S.uid(''), muse: m.id, title: 'An evening with ' + m.first + ' — ' + S.pickOne(['dinner and a gallery', 'a sunset and a long table', 'the opera and supper', 'a rooftop and a secret bar']), city: m.city, ends: S.now() + (24 + Math.random() * 72) * S.HOUR, reserve: S.pickOne([2500, 3500, 5000]), bids: [], status: 'live', charity: S.pickOne(['a scholarship fund', 'a women\'s refuge', 'ocean conservation', 'the arts council']) });
  };

  // ---------- salons ----------
  C.rsvp = function (mid, sid, method, cardId) {
    const s = S.state.salons.find(x => x.id === sid); const m = S.mem(mid);

  S.profilePraise = function (m) {
    const r = S.rng(m.id + 'praise'); const pairs = S.state.arrangements.filter(a => a.patron === m.id || a.muse === m.id);
    const others = pairs.map(a => a.patron === m.id ? a.muse : a.patron).concat(Object.values(S.state.convos).filter(c => c.a === m.id || c.b === m.id).slice(0, 3).map(c => c.a === m.id ? c.b : c.a));
    const lines = m.role === 'patron' ? ['Generous, punctual and genuinely interested in what I\'m building.', 'Every dinner felt like an occasion.', 'Respectful of every boundary. A true gentleman.', 'Paid my tuition straight to the school and never once made it awkward.', 'Kind, funny, and an excellent judge of wine.'] : ['Brilliant company and wonderfully discreet.', 'Ambitious, warm, always on time.', 'The best conversations I\'ve had in years.', 'Exactly as described, and better.', 'Thoughtful, elegant, and kept every promise.'];
    const real = (S.state.praise || []).filter(x => x.to === m.id && S.mem(x.from)).sort((a, b) => b.t - a.t);
    const seeded = [...new Set(others)].filter(o => !real.some(x => x.from === o)).slice(0, 3).map((o, i) => ({ from: o, text: lines[(S.hash(m.id) + i) % lines.length], t: S.now() - r.int(5, 120) * S.DAY }));
    return real.concat(seeded).slice(0, 4);
  };

      <div class="doc">${a.status === 'active' ? '<div class="stamp">SOVÉ<br>Escrow<br>Active</div>' : ''}<div style="font-weight:300;letter-spacing:.42em;font-size:20px">SOV<span style="color:var(--ox)">É</span></div><h2 class="mt32">Terms of Arrangement</h2><div class="small" style="color:#5a514c">Reference ${a.id} · ${a.start ? 'Effective ' + S.fDate(a.start) : 'Draft'}</div>
        <p class="mt24">This arrangement is made between <b>${esc(P.name)}</b> (“the Patron”) and <b>${esc(M.name)}</b> (“the Muse”), both verified members of SOVÉ.</p>
        <table><tr><td>Monthly allowance</td><td class="r">${S.$(a.allowance, 0)}</td></tr><tr><td>Evenings per month</td><td class="r">${a.meetings}</td></tr><tr><td>Travel</td><td class="r">${a.travel ? 'Included, with notice' : 'By agreement'}</td></tr><tr><td>Exclusivity</td><td class="r">${a.exclusive ? 'Exclusive' : 'Non-exclusive'}</td></tr><tr><td>Discretion</td><td class="r">${esc(a.discretion)}</td></tr><tr><td>Comfort</td><td class="r">${(a.comfort || []).map(esc).join(', ')}</td></tr></table>
        <ol class="mt24" style="padding-left:18px">${a.terms.map(t => `<li style="margin-bottom:8px">${esc(t)}</li>`).join('')}<li>Allowances are gifts made freely and are not payment for any act. Either member may decline any evening.</li><li>This arrangement is governed by the SOVÉ Terms of Membership.</li></ol>
        <div class="grid g2 stack mt32">${[P, M].map(x => `<div><div class="sig" style="min-height:44px">${a.signed[x.id] ? esc(x.first + ' ' + x.last) : ''}</div><div style="border-top:1px solid #b9ada0;padding-top:6px;font-size:.76rem;color:#5a514c">${esc(x.name)} · ${x.id === a.patron ? 'Patron' : 'Muse'}${a.signed[x.id] ? ' · signed ' + S.fDate(a.signed[x.id]) : ' · awaiting'}</div></div>`).join('')}</div></div>
      ${a.status === 'pending' && !mineSigned ? `<form data-form="sign" class="panel mt24"><input type="hidden" name="id" value="${a.id}"><h3>Sign</h3>${isP && !a.signed[me.id] && (a.allowance > 0) ? `<p class="small">Signing funds month one into escrow: <b>${S.$0(a.allowance)}</b> from your Balance (${S.$(S.wallet(me.id).bal)}).</p>` : ''}<div class="field"><label>Type your full name to sign</label><input class="inp" name="sig" placeholder="${esc(me.name)}" style="font-family:var(--script);font-size:1.6rem;height:56px"></div><label class="check"><input type="checkbox" name="ok"> I have read and agree to these Terms.</label><button class="btn fill">Sign Terms</button></form>` : ''}
      </div><div><div class="panel summary"><div class="row gap8">${U.who(isP ? M.id : P.id, isP ? 'Your Muse' : 'Your Patron')}</div><span class="chip ${a.status === 'active' ? 'ok' : 'ox'} mt16">${a.status}</span>
        <dl class="kv mt16"><dt>In escrow</dt><dd>${S.$0(a.escrow || 0)}</dd><dt>Released</dt><dd>${S.$0(a.released)}</dd><dt>Next release</dt><dd>${a.status === 'active' ? S.fDate(a.next) : '—'}</dd><dt>Months</dt><dd>${months}</dd></dl>
        <div class="col mt24">${a.status === 'active' ? `<button class="btn sm" data-act="arrpause" data-id="${a.id}">Pause</button>` : ''}${a.status === 'paused' ? `<button class="btn sm fill" data-act="arrresume" data-id="${a.id}">Resume</button>` : ''}${['active', 'paused'].includes(a.status) ? `<button class="btn sm ghost" data-act="arrend" data-id="${a.id}">End gracefully</button><button class="btn sm ghost" data-act="arrreview" data-id="${a.id}">Leave a review</button>` : ''}<a class="btn sm ghost" href="#/inbox/${S.cid(a.patron, a.muse)}">Message</a></div>
        <div class="mt24"><div class="kick mb8">History</div><div class="timeline">${a.history.slice().reverse().map(h => `<div class="ev on"><div class="small">${esc(h.text)}</div><div class="s">${S.fDate(h.t)}</div></div>`).join('')}</div></div>${a.reviews.length ? `<div class="mt16">${a.reviews.map(r => `<p class="small serif">“${esc(r.text)}” — ${esc(S.mem(r.by).first)}</p>`).join('')}</div>` : ''}</div></div></div></div>`;
  }, { auth: true, title: 'Arrangement' });
  S.FORM.sign = function (f, d) { const me = S.me(); if (!d.sig || d.sig.trim().length < 3) return U.fieldErr(f, 'sig', 'Type your name to sign.'); if (!d.ok) return U.err('Please confirm you agree to the Terms.'); const r = C.sign(d.id, me.id); if (!r.ok) { if (r.code === 'funds') return U.topUpModal(me.id, Math.ceil((S.state.arrangements.find(a => a.id === d.id).allowance - S.wallet(me.id).bal) / 1000) * 1000 + 1000, () => S.rerender()); return U.err(r.error); } U.toast('Signed.', { cls: 'dark' }); S.rerender(); };
  S.ACT.arrpause = el => U.confirm('Pause arrangement?', 'Releases stop until you resume. Escrow stays held.', 'Pause', () => { C.pauseArr(el.dataset.id, S.meId()); S.rerender(); });
  S.ACT.arrresume = el => { const r = C.resumeArr(el.dataset.id, S.meId()); if (!r.ok) return U.err(r.error); S.rerender(); };
  S.ACT.arrend = function (el) { const me = S.me(); const a = S.state.arrangements.find(x => x.id === el.dataset.id); U.modal('End gracefully', `<form data-form="arrend"><input type="hidden" name="id" value="${a.id}"><p>Escrow not yet released (${S.$0(a.escrow || 0)}) returns to the Patron. Confirmed evenings are always paid.</p>${me.id === a.patron ? `<div class="field"><label>Farewell gift (optional)</label><input class="inp" type="number" name="farewell" placeholder="0"></div>` : ''}<div class="field"><label>A last note</label><textarea class="inp" name="note"></textarea></div><button class="btn block">End arrangement</button></form>`); };
  S.FORM.arrend = function (f, d) { const me = S.me(); const a = S.state.arrangements.find(x => x.id === d.id); const fw = Math.round(+d.farewell || 0); if (fw && S.wallet(me.id).bal < fw) return U.err('Your Balance doesn\'t cover that gift.'); C.endArr(d.id, me.id, fw); if (d.note) S.send(me.id, me.id === a.patron ? a.muse : a.patron, d.note); U.closeAll(); S.rerender(); };
  S.ACT.arrreview = function (el) { U.modal('Review', `<form data-form="arrreview"><input type="hidden" name="id" value="${el.dataset.id}"><div class="field"><label>How is it going?</label><textarea class="inp" name="text"></textarea></div><button class="btn fill block">Save review</button></form>`); };
  S.FORM.arrreview = function (f, d) { const a = S.state.arrangements.find(x => x.id === d.id); if (d.text) a.reviews.push({ t: S.now(), by: S.meId(), text: d.text }); S.save(); U.closeAll(); S.rerender(); };

  // ---------- evenings ----------
  S.route('/account/dates', function () {
    const m = S.me(); const list = S.state.dates.filter(d => d.a === m.id || d.b === m.id).sort((a, b) => b.t - a.t);
    const up = list.filter(d => d.t > S.now() && ['booked', 'proposed'].includes(d.status)).reverse(); const past = list.filter(d => !up.includes(d)).slice(0, 30);
    const row = d => { const o = S.mem(d.a === m.id ? d.b : d.a); const tz = S.CITIES[d.city].tz; return `<div class="li"><img class="avatar" src="${S.avatar(o)}" alt="${esc((o || {}).first || '')}"><div class="grow"><div class="t">${esc(o.first)} · ${esc(d.venue)}</div><div class="s">${S.fFull(d.t, tz)}</div></div>${d.status === 'booked' ? `<button class="btn xs" data-act="checkin" data-id="${d.id}">${ic('shield')} Safety check-in</button><button class="btn xs ghost" data-act="dateics" data-id="${d.id}">${ic('cal')} Calendar</button>` : d.status === 'done' && !d.confirmed[m.id] ? `<button class="btn xs fill" data-act="dateconfirm" data-id="${d.id}">Confirm & rate</button>` : `<span class="chip">${d.status === 'done' ? (d.rating && d.rating[m.id] ? '★'.repeat(d.rating[m.id]) : 'Confirmed') : d.status}</span>`}</div>`; };
    return page('/dates', `<h1 class="d3">Evenings</h1><h2 class="h4 mt24">Upcoming</h2><div class="list mt8">${up.map(row).join('') || '<p class="small mute">Nothing booked. Propose a date from any profile.</p>'}</div><h2 class="h4 mt48">Past</h2><div class="list mt8">${past.map(row).join('') || '<p class="small mute">No past evenings.</p>'}</div>`);
  }, { auth: true, title: 'Evenings' });
  S.ACT.dateconfirm = function (el) { U.modal('How was it?', `<div class="center"><div class="row gap8" style="justify-content:center">${[1, 2, 3, 4, 5].map(n => `<button class="iconbtn" data-act="daterate" data-id="${el.dataset.id}" data-n="${n}">${n}★</button>`).join('')}</div><p class="small mute mt16">Confirming counts towards your arrangement's monthly release.</p></div>`); };
  S.ACT.daterate = el => { C.confirmDate(el.dataset.id, S.meId(), +el.dataset.n); U.closeAll(); U.toast('Thank you.', { cls: 'dark' }); S.rerender(); };
  S.ACT.checkin = function (el) { const d = S.state.dates.find(x => x.id === el.dataset.id); U.modal('Safety check-in', `<p>We'll message you at the time you choose. If you don't reply, we alert your trusted contact with the venue and time.</p><div class="field"><label>Check on me after</label><select class="inp" id="ckH"><option>1 hour</option><option selected>2 hours</option><option>3 hours</option><option>Next morning</option></select></div><div class="field"><label>Trusted contact</label><input class="inp" id="ckC" placeholder="Name and mobile"></div><div class="notice">${ic('shield')} Your contact sees only: ${esc(d.venue)}, ${S.fDT(d.t, S.CITIES[d.city].tz)}.</div>`, { foot: '<button class="btn sm fill" data-act="checkinset">Set check-in</button>' }); };
  S.ACT.checkinset = () => { U.closeAll(); U.toast('Check-in set. We\'ll text you.', { cls: 'dark' }); S.mail(S.meId(), 'sms', 'SOVÉ', '', 'SOVÉ check-in is set. Reply SAFE when you\'re home. Reply HELP for Concierge.'); };
  S.ACT.dateics = function (el) { const d = S.state.dates.find(x => x.id === el.dataset.id); const o = S.mem(d.a === S.meId() ? d.b : d.a); const dt = x => new Date(x).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z'; const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SOVE//EN\nBEGIN:VEVENT\nUID:${d.id}@sove\nDTSTAMP:${dt(S.now())}\nDTSTART:${dt(d.t)}\nDTEND:${dt(d.t + 3 * S.HOUR)}\nSUMMARY:Dinner — ${(S.me().settings.discreetName ? 'Private' : o.first)}\nLOCATION:${d.venue}, ${S.cityName(d.city)}\nEND:VEVENT\nEND:VCALENDAR`; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'evening.ics'; a.click(); };

  // ---------- goals ----------
  S.route('/account/goals', function () {
    const m = S.me();
    if (m.role === 'muse') { const mine = S.state.goals.filter(g => g.owner === m.id).sort((a, b) => b.created - a.created); return page('/goals', `<div class="ph-head"><h1 class="d3 mb0">My Wishes</h1><a class="btn sm fill" href="#/ledger/new">Post a Wish</a></div><div class="grid g2 stack">${mine.map(g => `<div>${U.gcard(g)}${g.status === 'open' ? `<div class="row gap8 mt8"><a class="btn xs" href="#/ledger/${g.id}">Post update</a><button class="btn xs ghost" data-act="goalcancel" data-id="${g.id}">Cancel & refund</button></div>` : ''}</div>`).join('') || U.empty('No Wishes yet.', 'spark')}</div>`); }
    const backed = {}; S.state.goals.forEach(g => g.backers.forEach(b => { if (b.mid === m.id) { backed[g.id] = (backed[g.id] || 0) + b.amt; } }));
    const ids = Object.keys(backed);
    return page('/goals', `<h1 class="d3">Wishes I fund</h1><p class="small mute">${S.$0(Object.values(backed).reduce((s, x) => s + x, 0))} across ${ids.length} Wishes.</p><div class="grid g2 stack mt16">${ids.map(id => { const g = S.state.goals.find(x => x.id === id); return `<div>${U.gcard(g)}<div class="small mt8">You gave ${S.$0(backed[id])}</div></div>`; }).join('') || U.empty('You haven\'t funded a Wish yet.', 'spark', '<a class="btn sm mt16" href="#/ledger">The Ledger</a>')}</div>`);
  }, { auth: true, title: 'Wishes' });
  S.ACT.goalcancel = el => U.confirm('Cancel this Wish?', 'Every backer is refunded in full.', 'Cancel Wish', () => { const g = S.state.goals.find(x => x.id === el.dataset.id); g.status = 'cancelled'; g.backers.forEach(b => { S.addTx(b.mid, b.amt, 'refund', 'Wish cancelled · ' + g.title); S.notify(b.mid, 'wish', '“' + g.title + '” was cancelled. You\'ve been refunded.', '#/account/wallet'); }); if (!g.direct) { const net = S.state.tx.filter(t => t.mid === g.owner && t.ref === g.id).reduce((s, t) => s + t.amt, 0); if (net) S.addTx(g.owner, -net, 'refund', 'Wish cancelled · refunds to backers'); } S.save(); S.rerender(); }, true);

  // ---------- verification ----------
  S.route('/account/verify', function (p, q) {
    const m = S.me(); const pend = m.verifyPending || {};
    const step = (k, t, d, done) => `<div class="li"><span class="iconbtn ${done ? 'fill' : ''}">${ic(done ? 'check' : 'shield')}</span><div class="grow"><div class="t">${t}</div><div class="s">${d}</div></div>${done ? '<span class="chip ok">Verified</span>' : pend[k] ? '<span class="chip ox">Reviewing…</span>' : `<button class="btn xs fill" data-act="verify" data-k="${k}">Start</button>`}</div>`;
    S.liveUpdate = () => S.rerender();
    return page('/verify', `${q.new ? `<div class="notice ox mb24">${ic('sparkle')} <div><b>Welcome to SOVÉ, ${esc(m.first)}.</b> Verify your identity to appear on the Register.</div></div>` : ''}<h1 class="d3">Verification</h1><p class="lead">Every member is verified. Documents are deleted the moment a decision is made.</p><div class="list mt24">${step('id', 'Identity', 'Government ID + live selfie · about 2 minutes', m.verified.id)}${m.role === 'patron' ? step('income', 'Income', 'Bank statement or accountant letter · same day', m.verified.income) + step('bg', 'Background check', 'Optional · shows a badge on your profile', m.verified.bg) : ''}</div>`);
  }, { auth: true, title: 'Verification' });
  S.ACT.verify = function (el) {
    const k = el.dataset.k; const m = S.me();
    if (k === 'id') {
      const mdl = U.modal('Verify your identity', `<div class="steps"><div class="on" id="v1">01 · Document</div><div id="v2">02 · Selfie</div><div id="v3">03 · Submit</div></div><div id="vbody"><div class="field"><label>Document type</label><select class="inp" id="vdoc"><option>Passport</option><option>Driving licence</option><option>National ID card</option></select></div><div class="field"><label>Upload front</label><input class="inp" type="file" accept="image/*" style="padding-top:11px"></div><div class="saved" data-act="vsample">${ic('key')} Use saved document scan</div></div>`, { foot: '<button class="btn sm fill" id="vnext">Continue</button>' });
      let st = 1;
      mdl.querySelector('#vnext').onclick = () => {
        st++;
        if (st === 2) { mdl.querySelector('#v1').className = 'done'; mdl.querySelector('#v2').className = 'on'; mdl.querySelector('#vbody').innerHTML = `<div class="center"><div style="width:180px;height:220px;border-radius:50%;border:2px dashed var(--ivory2);margin:0 auto;display:grid;place-items:center;overflow:hidden"><img src="${S.portrait(m)}" style="width:100%;height:100%;object-fit:cover;opacity:.85" alt=""></div><p class="small mt16" id="vlive">Hold still… turn your head slowly to the left.</p></div>`; setTimeout(() => { const x = mdl.querySelector('#vlive'); if (x) x.textContent = 'Liveness confirmed ✓'; }, 1800); }
        if (st === 3) { mdl.querySelector('#v2').className = 'done'; mdl.querySelector('#v3').className = 'on'; mdl.querySelector('#vbody').innerHTML = `<p>Your document and selfie are ready. Most reviews finish in under two minutes.</p>`; mdl.querySelector('#vnext').textContent = 'Submit'; }
        if (st === 4) { C.startVerify(m.id, 'id'); U.close(mdl); U.toast('Submitted. We\'ll notify you shortly.', { cls: 'dark' }); S.rerender(); }
      };
      return;
    }
    U.modal(k === 'income' ? 'Verify income' : 'Background check', `<div class="field"><label>${k === 'income' ? 'Upload a bank statement or accountant letter' : 'Consent'}</label>${k === 'income' ? '<input class="inp" type="file" style="padding-top:11px"><div class="saved mt8" data-act="vsample">' + ic('key') + ' Use saved statement</div>' : '<label class="check"><input type="checkbox" checked> I consent to a background check by SOVÉ\'s verification partner.</label>'}</div>`, { foot: `<button class="btn sm fill" data-act="vsubmit" data-k="${k}">Submit</button>` });
  };
  S.ACT.vsample = el => { el.innerHTML = ic('check') + ' Saved document attached'; };
  S.ACT.vsubmit = el => { C.startVerify(S.meId(), el.dataset.k); U.closeAll(); U.toast('Submitted for review.', { cls: 'dark' }); S.rerender(); };

  // ---------- settings ----------
  S.route('/account/settings', function () {

      ${m.role === 'patron' ? `<h2 class="h4 mt32">The Gilded List</h2><div class="seg mt8">${[['full', 'Full name'], ['initials', 'Initials'], ['anon', 'Anonymous']].map(([v, l]) => `<button class="${s.showOnGilded === v ? 'on' : ''}" data-act="gildset" data-v="${v}">${l}</button>`).join('')}</div>` : ''}
      <h2 class="h4 mt32">Notifications</h2><div class="list mt8">${tog('notifyEmail', 'Email', 'Receipts, offers and gifts.')}${tog('notifySms', 'Text messages', 'Sign-in codes and check-ins always arrive.')}</div>
      <h2 class="h4 mt32">Security</h2><div class="list mt8"><div class="li"><div class="grow"><div class="t">Two-step sign-in</div><div class="s">Code by text to ${esc(m.phone)}</div></div><span class="chip ok">On</span></div><div class="li"><div class="grow"><div class="t">Password</div><div class="s">Last changed ${S.fDate(m.joined + 40 * S.DAY)}</div></div><button class="btn xs" data-act="pwchange">Change</button></div>${devs.map(d => `<div class="li"><div class="grow"><div class="t">${d.n}${d.cur ? ' · this device' : ''}</div><div class="s">${d.d} · ${S.ago(d.t)}</div></div>${d.cur ? '' : '<button class="btn xs ghost" data-act="devout">Sign out</button>'}</div>`).join('')}<div class="li"><div class="grow"><div class="t">Trusted on this device</div><div class="s">${S.state.devices[m.id] ? 'Skips the code until ' + S.fDate(S.state.devices[m.id] + 30 * S.DAY) : 'Not trusted'}</div></div>${S.state.devices[m.id] ? '<button class="btn xs ghost" data-act="untrust">Forget</button>' : ''}</div></div>
      <h2 class="h4 mt32">Your data</h2><div class="list mt8"><div class="li"><div class="grow"><div class="t">Download your data</div><div class="s">Profile, messages, transactions, as a file.</div></div><button class="btn xs" data-act="mydata">Download</button></div><div class="li"><div class="grow"><div class="t">Close membership</div><div class="s">Escrow is settled, balances paid out, profile deleted in 30 days.</div></div><button class="btn xs ghost" data-act="closeacct">Close</button></div></div>`);
  }, { auth: true, title: 'Settings' });

  S.ACT.gildset = el => { S.me().settings.showOnGilded = el.dataset.v; S.save(); S.rerender(); };
  S.ACT.pwchange = () => { U.modal('Change password', `<form data-form="pw"><div class="field"><label>Current password</label><input class="inp" type="password" name="cur"></div><div class="field"><label>New password</label><input class="inp" type="password" name="nw"></div><button class="btn fill block">Change password</button></form>`); };
  S.FORM.pw = (f, d) => { if (String(d.nw).length < 8) return U.fieldErr(f, 'nw', 'At least 8 characters.'); U.closeAll(); S.mail(S.meId(), 'email', 'SOVÉ Security', 'Your password was changed', 'If this wasn\'t you, contact Concierge immediately.'); U.toast('Password changed.', { cls: 'dark' }); };

  S.FORM.dispatch = function (f, d) {
    const a = d.from, b = d.to; if (a === b) return U.err('Choose two different members.'); const A = S.mem(a), B = S.mem(b);
    const amt = Math.round(+d.x) || 0;
    switch (d.kind) {
      case 'message': S.E.npcSay(a, b, [d.x || S.Voice.style(A, S.fill(S.pickOne(S.Voice.L[S.Voice.side(A)].howareyou), S.Voice.vars(A, B, S.rel(a, b))))]); break;
      case 'opener': S.E.npcSay(a, b, [S.Voice.style(A, S.fill(S.pickOne(S.Voice.OPEN[S.Voice.side(A)]), S.Voice.vars(A, B, S.rel(a, b))))]); break;
      case 'gift': { const pid = B.wish[0] || 'cartier-love'; S.wallet(a).bal += S.prod(pid).price; C.npcSendGift(a, b, pid, null, 2 * S.MIN); break; }
      case 'goal': { const g = S.goalOf(b); if (!g) return U.err(B.first + ' has no open Wish.'); C.fundGoal(a, g.id, amt || 1000, false, null, true); break; }

      case 'roses': S.wallet(a).bal += amt || 100; C.sendRoses(a, b, amt || 100); break;
      case 'sub': if (!B.creator) return U.err(B.first + ' isn\'t a creator.'); C.subscribe(a, b, 'vip', null, null, 'balance'); break;
      case 'tip': if (!B.creator) return U.err(B.first + ' isn\'t a creator.'); C.tip(a, b, amt || 100, d.x && !amt ? d.x : 'For you'); break;
      case 'wink': S.state.winks.push({ from: a, to: b, t: S.now() }); S.notify(b, 'wink', A.first + ' sent you a wink', '#/m/' + a); break;
      case 'follow': (S.state.follows[a] = S.state.follows[a] || []).push(b); S.notify(b, 'follow', A.first + ' started following you', '#/m/' + a); break;
    }
    S.log('Dispatched ' + d.kind + ' ' + A.name + ' → ' + B.name); S.save(); U.toast('Dispatched.', { cls: 'dark' });
  };

  S.ACT.importworld = function (el) { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const st = JSON.parse(r.result); if (!st.members || !st.v) throw 0; S.state = st; S.save(true); U.toast('Loaded.', { cls: 'dark' }); S.render(); } catch (e) { U.err('That file isn\'t a SOVÉ house file.'); } }; r.readAsText(f); };
  S.ACT.resetworld = () => U.confirm('Reset the house?', 'Every member, conversation, order and balance returns to the beginning.', 'Reset', () => { const snaps = S.state.snapshots; S.resetWorld(); S.state.snapshots = snaps; S.setMe(null); S.save(true); U.toast('The house has been reset.', { cls: 'dark' }); S.go('#/concierge'); }, true);

  S.route('/concierge/log', function () {
    const log = (S.state.log || []).slice().reverse().slice(0, 200);
    return page('/log', `<h1 class="d3">Activity log</h1><div class="list mt16">${log.map(l => `<div class="li"><span class="tiny mute" style="width:140px">${S.fDT(l.t)}</span><span class="small">${esc(l.text)}</span></div>`).join('') || '<p class="small mute">Nothing logged yet.</p>'}</div><h2 class="h4 mt32">Scheduled</h2><table class="t mt8">${S.state.queue.slice().sort((a, b) => a.due - b.due).slice(0, 40).map(q => `<tr><td class="small">${q.type}</td><td class="small mute">${S.fDT(q.due)}</td><td class="tiny mute">${esc(JSON.stringify(q.data).slice(0, 80))}</td></tr>`).join('')}</table>`);
  }, { staff: true, title: 'Log' });
})(window.S);

/* SOVÉ — boot */
(function (S) {
  const U = S.U;
  function boot() {
    const fresh = S.load();
    S.applyDisplay();
    U.bind();
    // members who reply
    S.onWorld = function () {
      U.header(); U.tickerBar();
      if (S.liveUpdate) { try { S.liveUpdate(); } catch (e) { console.error(e); } }
      S.$$('[data-countdown]').forEach(el => el.textContent = S.countdown(+el.dataset.countdown));
    };
    // catch up immediately (the world kept living while you were away)
    S.tick({ force: true });
    S.render();
    U.ageGate();
    S.loadUploads().then(() => { if (Object.keys(S.UPLOADS).some(k => !k.startsWith('kv:'))) S.rerender(); });
    setInterval(() => S.tick(), 3000);
    setInterval(() => S.$$('[data-countdown]').forEach(el => el.textContent = S.countdown(+el.dataset.countdown)), 1000);
    // other tabs
    const onOther = S.debounce(() => { S.reloadFromDisk(); U.header(); U.tickerBar(); if (S.liveUpdate) S.liveUpdate(); }, 120);
    if (S.bc) S.bc.onmessage = e => { if (e.data && e.data.tab !== S.TAB) onOther(); };
    window.addEventListener('storage', e => { if (e.key === 'sove.world') onOther(); });
    if (!S.storageOk) U.toast('Your browser is blocking storage, so changes will last for this visit only.', { cls: 'dark', ms: 8000 });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.S);
</script>
